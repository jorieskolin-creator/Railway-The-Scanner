<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptability Scanner | Forensic Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Babel for in-browser compilation of TSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9;
        color: #0f172a;
        overflow-x: hidden;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 12s ease-in-out infinite;
      }
      @keyframes ref-pulse {
        0% { transform: scale(1); opacity: 0.5; }
        80% { transform: scale(2.2); opacity: 0; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes ref-pulse-delayed {
        0% { transform: scale(1); opacity: 0.3; }
        80% { transform: scale(2.5); opacity: 0; }
        100% { transform: scale(2.5); opacity: 0; }
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #e2e8f0; }
      ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; border: 2px solid #e2e8f0; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
    
    <!-- Initialize Globals and Load App -->
    <script type="module">
      import React from 'https://esm.sh/react@18.2.0';
      import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0';
      import * as Lucide from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';
      import * as Recharts from 'https://esm.sh/recharts@2.12.3?deps=react@18.2.0,react-dom@18.2.0';
      // 1. Set Globals and Normalize Modules
      window.React = React;
      window.ReactDOM = { createRoot };

      // Handle ESM modules that might export via 'default' or named exports
      window.Lucide = Lucide.default || Lucide;
      window.Recharts = Recharts.default || Recharts;

      // Debugging
      console.log("Globals initialized:", {
        React: !!window.React,
        ReactDOM: !!window.ReactDOM,
        LucideKeys: Object.keys(window.Lucide).length,
        RechartsKeys: Object.keys(window.Recharts).length
      });

      // 2. Define App Scripts in dependency order (cache-busted to prevent stale browser cache)
      var cacheBust = '?v=' + Date.now();
      const scripts = [
        "/types.ts" + cacheBust,
        "/constants.ts" + cacheBust,
        "/components/ScannerInput.tsx" + cacheBust,
        "/components/TruthMatrix.tsx" + cacheBust,
        "/components/CompanySummary.tsx" + cacheBust,
        "/components/ThemeExplorer.tsx" + cacheBust,
        "/components/MarketIntelligenceModal.tsx" + cacheBust,
        "/components/ObservatoryModal.tsx" + cacheBust,
        "/components/CompanyModal.tsx" + cacheBust,
        "/App.tsx" + cacheBust,
        "/index.tsx" + cacheBust
      ];

      // 3. Helper to load scripts sequentially and compile with Babel
      async function loadScripts(urls) {
        for (const url of urls) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to fetch ${url}`);
            const tsx = await response.text();
            
            // Transform TSX/TS to JS using Babel
            // Strip query string from filename so Babel detects .ts/.tsx extensions correctly
            const cleanFilename = url.split('?')[0];
            const js = Babel.transform(tsx, {
              presets: [
                ['react', { runtime: 'classic' }],
                'typescript',
              ],
              filename: cleanFilename,
            }).code;

            // Execute in IIFE using string concatenation
            const script = document.createElement('script');
            script.textContent = "(function() { try { \n" + js + "\n } catch(e) { console.error('Error executing " + url + ":', e); window.LAST_ERROR = e; document.body.innerHTML += '<div style=\"color:red;padding:10px;background:rgba(0,0,0,0.8);position:fixed;top:0;left:0;z-index:9999\">Error in " + url + ": ' + e.message + '</div>'; } })();";
            document.body.appendChild(script);
          } catch (error) {
            console.error(`Error loading script ${url}:`, error);
            document.body.innerHTML += `<div style="color:red;padding:10px;background:rgba(0,0,0,0.8);position:fixed;top:50px;left:0;z-index:9999">Failed to load ${url}: ${error.message}</div>`;
          }
        }
      }

      // Start loading only if dependencies are ready
      if (window.ReactDOM && window.ReactDOM.createRoot && window.React && window.Lucide) {
          loadScripts(scripts);
      } else {
          console.error("Critical: Global dependencies (React, ReactDOM, Lucide) not loaded. Aborting.");
          document.body.innerHTML = "<div style='color:red; padding:20px'>Critical Error: Failed to load dependencies from CDN. Check internet connection or console.</div>";
      }
    </script>
</head>
  <body class="bg-[#f1f5f9] text-slate-900 antialiased">
    <div id="root"></div>
  </body>
</html>
