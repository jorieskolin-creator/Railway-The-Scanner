<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptability Scanner | Forensic Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Babel for in-browser compilation of TSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #1e1b4b;
        color: #f8fafc;
        overflow-x: hidden;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 12s ease-in-out infinite;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #1e1b4b; }
      ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; border: 2px solid #1e1b4b; }
      ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    </style>
    
    <!-- Initialize Globals and Load App -->
    <script type="module">
      import React from 'https://esm.sh/react@18.2.0';
      import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0';
      import * as Lucide from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';
      import * as Recharts from 'https://esm.sh/recharts@2.12.3?deps=react@18.2.0,react-dom@18.2.0';
      import { GoogleGenAI } from 'https://esm.sh/@google/genai@0.1.1';

      // 1. Set Globals
      window.React = React;
      window.ReactDOM = { createRoot };
      window.Lucide = Lucide;
      window.Recharts = Recharts;
      window.GoogleGenAI = GoogleGenAI;

      // Debugging
      console.log("React initialized:", !!window.React);
      console.log("ReactDOM initialized:", !!window.ReactDOM);

      // 2. Define App Scripts in dependency order
      const scripts = [
        "/types.ts",
        "/constants.ts",
        "/services/geminiService.ts",
        "/services/mockScannerService.ts",
        "/components/ScannerInput.tsx",
        "/components/TruthMatrix.tsx",
        "/components/CompanySummary.tsx",
        "/components/CompanyModal.tsx",
        "/App.tsx",
        "/index.tsx"
      ];

      // 3. Helper to load scripts sequentially and compile with Babel
      async function loadScripts(urls) {
        for (const url of urls) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to fetch ${url}`);
            const tsx = await response.text();
            
            // Transform TSX/TS to JS using Babel
            const js = Babel.transform(tsx, {
              presets: ['react', 'typescript'],
              filename: url,
            }).code;

            // Execute
            const script = document.createElement('script');
            script.textContent = js;
            document.body.appendChild(script);
          } catch (error) {
            console.error(`Error loading script ${url}:`, error);
          }
        }
      }

      // Start loading only if dependencies are ready
      if (window.ReactDOM && window.ReactDOM.createRoot) {
          loadScripts(scripts);
      } else {
          console.error("Critical: ReactDOM not loaded properly. Aborting script loading.");
      }
    </script>

</script>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
  <body class="bg-[#1e1b4b] text-slate-100 antialiased">
    <div id="root"></div>
  </body>
</html>
