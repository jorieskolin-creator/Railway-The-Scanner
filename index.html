<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptability Scanner | Forensic Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Babel for in-browser compilation of TSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #1e1b4b;
        color: #f8fafc;
        overflow-x: hidden;
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      .animate-pulse-glow {
        animation: pulse-glow 12s ease-in-out infinite;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #1e1b4b; }
      ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; border: 2px solid #1e1b4b; }
      ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    </style>
    
    <!-- Initialize Globals from ESM -->
    <script type="module">
      import React from 'https://esm.sh/react@18.2.0';
      import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
      import * as Lucide from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';
      import * as Recharts from 'https://esm.sh/recharts@2.12.3?deps=react@18.2.0,react-dom@18.2.0';
      import { GoogleGenAI } from 'https://esm.sh/@google/genai@0.1.1';

      window.React = React;
      window.ReactDOM = ReactDOM;
      window.Lucide = Lucide;
      window.Recharts = Recharts;
      window.GoogleGenAI = GoogleGenAI;
</script>
</head>
  <body class="bg-[#1e1b4b] text-slate-100 antialiased">
    <div id="root"></div>
    
    <!-- Load App Scripts in Dependency Order (Non-Module for Browser Scope) -->
    <script type="text/babel" src="/types.ts"></script>
    <script type="text/babel" src="/constants.ts"></script>
    <script type="text/babel" src="/services/geminiService.ts"></script>
    <script type="text/babel" src="/services/mockScannerService.ts"></script>
    <script type="text/babel" src="/components/ScannerInput.tsx"></script>
    <script type="text/babel" src="/components/TruthMatrix.tsx"></script>
    <script type="text/babel" src="/components/CompanySummary.tsx"></script>
    <script type="text/babel" src="/components/CompanyModal.tsx"></script>
    <script type="text/babel" src="/App.tsx"></script>
    <script type="text/babel" src="/index.tsx"></script>
  </body>
</html>
